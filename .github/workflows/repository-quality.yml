name: Repository quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: python .github/scripts/repository_check.py --self-test
      - run: python .github/scripts/repository_check.py
      - name: Install dependency resolver
        run: python -m pip install uv==0.12.10
      - name: Validate locked Python dependencies
        run: uv pip install --dry-run --system --require-hashes -r requirements.lock.txt

      - name: Exercise offline provider requests
        run: python -m unittest discover -s tests -p "test_claude*.py"
